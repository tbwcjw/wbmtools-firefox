<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <button class="row" id="raw">
        <span class="icon">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M5.5 3.5 1 8l4.5 4.5 1-1L3 8l3.5-3.5-1-1Zm5 0-1 1L13 8l-3.5 3.5 1 1L15 8l-4.5-4.5Z" />
            </svg>
        </span>
        <span class="text">
            <span class="title">View Raw</span>
            <span class="subtitle">Raw archived page</span>
        </span>
    </button>

    <button class="row" id="source">
        <span class="icon">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5l-4-4H4Zm5 1.5L11.5 5H9V2.5ZM5 7h6v1H5V7Zm0 3h6v1H5v-1Z" />
            </svg>
        </span>
        <span class="text">
            <span class="title">View Source</span>
            <span class="subtitle">Raw page source</span>
        </span>
    </button>

    <button class="row" id="wayback">
        <span class="icon">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <path fill-rule="evenodd" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm0 1.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11ZM7.25 4.5v4l2.9 1.74.77-1.28-2.17-1.3V4.5h-1.5Z" />
            </svg>
        </span>
        <span class="text">
            <span class="title">Open in Wayback</span>
            <span class="subtitle">View the latest snapshot</span>
        </span>
    </button>

    <button class="row" id="save">
        <span class="icon">
            <svg viewBox="0 0 16 16" aria-hidden="true">
    <path fill-rule="evenodd" d="M3 2h8l3 3v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Zm2 1.5h5V6H5V3.5ZM4.5 9h7v3.5h-7V9Z" />
</svg>
        </span>
        <span class="text">
            <span class="title">Save to Wayback</span>
            <span class="subtitle">Save this page as a snapshot</span>
        </span>
    </button>

    <script src="../wb.js"></script>
    <script src="popup.js"></script>
</body>

</html>
